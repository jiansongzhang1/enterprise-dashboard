# 项目相关配置
fivetech:
  # 名称
  name: FiveTech
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/fivetech/uploadPath，Linux配置 /home/fivetech/uploadPath）
  profile: D:/fivetech/uploadPath
  # 获取ip地址开关
  addressEnabled: false

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用访问前缀：本地默认根路径，CloudFront 生产环境使用 /prod-api
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/}
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.fivetech: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # Redis配置，生产环境通过环境变量覆盖
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      client-type: lettuce
      ssl:
        enabled: ${REDIS_SSL:false}
  # 邮件服务配置，生产环境通过环境变量覆盖
  mail:
    host: ${MAIL_HOST:email-smtp.ap-southeast-1.amazonaws.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:AKIAWT4LD4WRGYCR44DV}
    password: ${MAIL_PASSWORD:BJtVu2GKm+mdArnBl7O4ggaJzIR+vBR2c+AuZeAif8z1}
    protocol: ${MAIL_PROTOCOL:smtp}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

# 邮件通知配置
notification:
  email:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:jackson@fivetech.co.jp}
    # 账号通知邮件（繁體）：开通时发启用链接，密码变更、停用、重新启用时发通知；邮件中不含任何密码
    account:
      enabled: ${MAIL_ACCOUNT_ENABLED:true}
      # 平台名称，用于邮件主题和正文
      platform-name: ${MAIL_PLATFORM_NAME:Yata}
      # 前台访问地址（含部署子路径，不带结尾斜杠），启用链接为 {portal-url}/activate?token=…
      # 必填：留空时无法新建账号（收不到启用链接）
      portal-url: ${MAIL_PORTAL_URL:}
      # 启用链接有效小时数（24–168）
      link-expire-hours: ${MAIL_LINK_EXPIRE_HOURS:72}
      # 邮件中时间的显示时区，如 Asia/Taipei；留空使用服务器时区
      time-zone: ${MAIL_TIME_ZONE:}
  telegram:
    enabled: ${TELEGRAM_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    timeout-seconds: ${TELEGRAM_TIMEOUT_SECONDS:10}
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:true}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    graph-api-version: ${WHATSAPP_GRAPH_API_VERSION:v23.0}
    timeout-seconds: ${WHATSAPP_TIMEOUT_SECONDS:10}
  lark:
    enabled: ${LARK_ENABLED:false}
    app-id: ${LARK_APP_ID:}
    app-secret: ${LARK_APP_SECRET:}
    api-base-url: ${LARK_API_BASE_URL:https://open.larksuite.com}
    timeout-seconds: ${LARK_TIMEOUT_SECONDS:10}

# 仪表板查询配置
dashboard:
  # 默认站点，一期单站点
  default-site: ${DASHBOARD_SITE:SITE-IN}
  # 统计时区，日切与环比同比都依此时区
  timezone: ${DASHBOARD_TIMEZONE:Asia/Kolkata}
  # 币别，一期单币别不做汇率折算
  currency: ${DASHBOARD_CURRENCY:INR}
  # 站点上线日，所有时间选择的下界
  launch-date: ${DASHBOARD_LAUNCH_DATE:2026-03-01}
  # 指标口径版本
  registry-version: ${DASHBOARD_REGISTRY_VERSION:v1.3}
  # 数据延迟小时数，落在窗口内的时间片标记 delayed
  delay-window-hours: ${DASHBOARD_DELAY_HOURS:2}
  # 在线查询行数上限，超过引导走异步导出
  row-limit: ${DASHBOARD_ROW_LIMIT:100000}
  # 单次查询最大数据点数，超过自动降级粒度
  max-points-per-granularity: ${DASHBOARD_MAX_POINTS:744}
  # 会员账号是否脱敏
  mask-account: ${DASHBOARD_MASK_ACCOUNT:true}
  gateway:
    # UDS 统一数据服务对接
    uds:
      # POC 走本机 SSM 端口转发；端口转发断了这里就连不通，不是应用的问题
      base-url: ${UDS_BASE_URL:http://172.29.106.105:18082}
      query-path: ${UDS_QUERY_PATH:/v1/query}
      # X-Uds-* 是测试身份头，不是认证。生产请用服务账号而不是个人账号
      principal: ${UDS_PRINCIPAL:fivetech-dashboard}
      tenant: ${UDS_TENANT:site:SITE-IN}
      roles: ${UDS_ROLES:dashboard_ops}
      # ops_hourly 是站点级 ADS 汇总，不做商户隔离，因此不传 merchant-codes。
      # 只有 merchant_bet_hourly 那条下钻链路才需要它
      merchant-codes: ${UDS_MERCHANT_CODES:}
      connect-timeout-seconds: ${UDS_CONNECT_TIMEOUT:5}
      # 留 25 秒：CloudFront 源站超时是 30 秒，要给自己留出返回和序列化的余量
      read-timeout-seconds: ${UDS_READ_TIMEOUT:25}
      # 上游水位低于请求上界时（HTTP 400 code=4403）：已拿到过上游水位就直接截到水位，
      # 只有冷启动还没有水位时，才按粒度逐格回退，最多回退这么多格
      not-ready-retries: ${UDS_NOT_READY_RETRIES:6}
      # 探到的水位缓存秒数；过期后重新试满区间，上游追上进度时自动恢复
      watermark-cache-seconds: ${UDS_WATERMARK_CACHE_SECONDS:120}
      # 指标映射：本系统指标编码 -> UDS 数据集与指标名。改口径只改这里，不用发版
      datasets:
        # 运营看板 21 个指标全部来自这一个数据集，一次查询就能取全
        ops_hourly:
          time-dimension: biz_hh
          grain: HOUR
          dimensions:
            - biz_hh
          options:
            channel: ADHOC
          metrics:
            # eg1 获客与转化
            login: login_users
            reg: register_users
            ftd: first_deposit_users
            ftdr: first_deposit_conversion_rate
            ftdA: first_deposit_arppu
            # eg2 资金流
            dep: deposit_amount
            wd: withdrawal_amount
            net: net_deposit
            arppu: arppu
            turnX: turnover_multiple
            # eg3 支付健康度
            dOkR: deposit_success_rate
            dT: avg_deposit_time
            wOkR: withdrawal_success_rate
            wT: avg_withdrawal_time
            # eg4 投注与盈收
            active: active_users
            bet: bet_amount
            ggr: ggr
            killR: average_kill_rate
            bonus: bonus_amount
            bonusR: bonus_ratio
            # 口径差异：UDS 侧 ngr = ggr - bonus_amount - refund - overflow，比原型多两项扣减
            ngr: ngr
      # 明细数据集：UDS 是否支持明细查询待确认，未配置时明细接口返回空结果。
      # 注意不要写成 details: {} —— Spring Boot 会把空 map 压成空字符串导致绑定失败，
      # 需要时按下面的结构补齐即可：
      #   details:
      #     member:
      #       dataset: member_detail
      #       time-dimension: dt
      #       fields:
      #         account: member_account
      #         registerTime: reg_time
  # CSV 导出（请求体传 export_csv=true 触发）
  export:
    enabled: ${DASHBOARD_EXPORT_ENABLED:true}
    # ALL_FILTERED = 当前筛选条件下的全部数据（忽略分页）；CURRENT_PAGE = 只导当前页
    scope: ${DASHBOARD_EXPORT_SCOPE:ALL_FILTERED}
    # 是否在文件开头写口径说明区（程序消费时建议关闭）
    include-meta: ${DASHBOARD_EXPORT_INCLUDE_META:true}
    # 单次导出最大行数
    max-rows: ${DASHBOARD_EXPORT_MAX_ROWS:100000}
    # 明细含个人信息，导出默认要求独立权限点
    require-permission: ${DASHBOARD_EXPORT_REQUIRE_PERMISSION:true}
    permission: ${DASHBOARD_EXPORT_PERMISSION:dashboard:export:csv}

# 健康检查与监控端点
# 独立端口 8081，安全组只对内网/探活来源开放，绝不暴露公网
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true

# 系统错误告警：研发/运维侧的异常推送，与仪表板的业务指标告警不是同一套
# 生产开启前务必先配 telegram-chat-ids，否则只会写日志不会推送
alert:
  # 总开关，关闭时只记日志
  enabled: ${ALERT_ENABLED:false}
  # 环境标识，出现在消息首行，避免测试环境告警被误当成生产
  env: ${ALERT_ENV:local}
  # 实例标识，留空取主机名
  instance: ${ALERT_INSTANCE:}
  # Telegram 接收方 chat_id，多个用逗号分隔
  telegram-chat-ids: ${ALERT_TELEGRAM_CHAT_IDS:}
  # 同一异常指纹的静默窗口（秒）
  dedup-window-seconds: ${ALERT_DEDUP_WINDOW_SECONDS:300}
  # 全局每分钟最大推送条数
  rate-per-minute: ${ALERT_RATE_PER_MINUTE:10}
  # 消息中携带的堆栈行数
  stack-lines: ${ALERT_STACK_LINES:6}
  # 异步发送队列容量
  queue-capacity: ${ALERT_QUEUE_CAPACITY:200}

# token配置
token:
  # 令牌自定义标识return userId != null && 1L == userId;
  header: Authorization
  # 令牌密钥
  secret: ${TOKEN_SECRET:0ce51bf42033cfcf3805e49a15dee5818802f534e8d4958122c5c4bcea63cb254a1068d727a10c2db5307a8240db083a}
  # 令牌有效期，单位：分钟
  expireTime: ${TOKEN_EXPIRE_TIME:30}

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.fivetech.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: postgresql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.fivetech.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,fivetech.vip,www.fivetech.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes:
  # 排除链接（多个用逗号分隔）
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
