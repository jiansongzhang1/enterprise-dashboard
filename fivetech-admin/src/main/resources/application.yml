# 项目相关配置
fivetech:
  # 名称
  name: FiveTech
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/fivetech/uploadPath，Linux配置 /home/fivetech/uploadPath）
  profile: D:/fivetech/uploadPath
  # 获取ip地址开关
  addressEnabled: false

# Doris read-only data source. Keep disabled for local environments without VPC access.
doris:
  enabled: ${DORIS_ENABLED:false}
  url: ${DORIS_URL:jdbc:mysql://ip-10-32-16-87.ap-southeast-1.compute.internal:9030/dmo_dwh_dwd_2b2c_rt}
  username: ${DORIS_USERNAME:}
  password: ${DORIS_PASSWORD:}

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用访问前缀：本地默认根路径，CloudFront 生产环境使用 /prod-api
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/}
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.fivetech: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # Redis配置，生产环境通过环境变量覆盖
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      client-type: lettuce
      ssl:
        enabled: ${REDIS_SSL:false}
  # 邮件服务配置，生产环境通过环境变量覆盖
  mail:
    host: ${MAIL_HOST:email-smtp.ap-southeast-1.amazonaws.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:AKIAWT4LD4WRGYCR44DV}
    password: ${MAIL_PASSWORD:BJtVu2GKm+mdArnBl7O4ggaJzIR+vBR2c+AuZeAif8z1}
    protocol: ${MAIL_PROTOCOL:smtp}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true

# 邮件通知配置
notification:
  email:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:jackson@fivetech.co.jp}
  telegram:
    enabled: ${TELEGRAM_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    timeout-seconds: ${TELEGRAM_TIMEOUT_SECONDS:10}
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:true}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    graph-api-version: ${WHATSAPP_GRAPH_API_VERSION:v23.0}
    timeout-seconds: ${WHATSAPP_TIMEOUT_SECONDS:10}
  lark:
    enabled: ${LARK_ENABLED:false}
    app-id: ${LARK_APP_ID:}
    app-secret: ${LARK_APP_SECRET:}
    api-base-url: ${LARK_API_BASE_URL:https://open.larksuite.com}
    timeout-seconds: ${LARK_TIMEOUT_SECONDS:10}

# token配置
token:
  # 令牌自定义标识return userId != null && 1L == userId;
  header: Authorization
  # 令牌密钥
  secret: ${TOKEN_SECRET:}
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.fivetech.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: postgresql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.fivetech.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,fivetech.vip,www.fivetech.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes:
  # 排除链接（多个用逗号分隔）
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
